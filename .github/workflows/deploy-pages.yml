name: Deploy MetaalMeesters demo to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'site.source.html'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/normalize-build.mjs'
      - 'vite.config.js'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Compile React application for Pages
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Validate compiled HTML
        run: |
          test -f dist/index.html
          test -d dist/assets
          if grep -q 'src/main.jsx' dist/index.html; then
            echo 'ERROR: attempted to publish uncompiled React source'
            exit 1
          fi
      # Repository Pages had *two competing deployments*: legacy Jekyll from
      # main and our custom build. Publish compiled HTML to main as well so
      # the legacy publisher cannot overwrite the app with uncompiled JSX.
      - name: Synchronize compiled build with legacy Pages root
        run: |
          cp dist/index.html index.html
          mkdir -p assets images homes
          cp -R dist/assets/. assets/
          if [ -d dist/images ]; then cp -R dist/images/. images/; fi
          if [ -d dist/homes ]; then cp -R dist/homes/. homes/; fi
          touch .nojekyll
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets images homes .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Publish compiled MetaalMeesters website [skip ci]"
            git push
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4
