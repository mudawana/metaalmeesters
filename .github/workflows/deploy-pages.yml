name: Deploy MetaalMeesters preview to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'site.source.html'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/normalize-build.mjs'
      - 'vite.config.js'
      - 'scripts/generate-seo-pages.mjs'
      - 'src/seo-routes.js'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://mudawana.github.io/metaalmeesters/
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Compile React application for Pages
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Validate compiled HTML
        run: |
          test -f dist/index.html
          test -d dist/assets
          test -f dist/404.html
          for legal in privacy cookies bedrijfsgegevens; do
            test -f "dist/$legal/index.html" || { echo "Missing built legal page: $legal"; exit 1; }
          done
          test -f "dist/over-ons/index.html"
          for seo in stalen-deuren-op-maat pivotdeuren boogdeuren stalen-glaswanden glas-voor-stalen-deuren prijs-stalen-deuren; do
            test -f "dist/$seo/index.html" || { echo "Missing SEO page: $seo"; exit 1; }
          done
          # Never let the GitHub preview compete with the real production domain.
          grep -q "noindex,follow" dist/stalen-deuren-op-maat/index.html
          if grep -q 'src/main.jsx' dist/index.html; then
            echo 'ERROR: attempted to publish uncompiled React source'
            exit 1
          fi
      # Repository Pages had *two competing deployments*: legacy Jekyll from
      # main and our custom build. Publish compiled HTML to main as well so
      # the legacy publisher cannot overwrite the app with uncompiled JSX.
      - name: Synchronize compiled build with legacy Pages root
        run: |
          cp dist/index.html index.html
          mkdir -p assets images homes
          cp -R dist/assets/. assets/
          if [ -d dist/images ]; then cp -R dist/images/. images/; fi
          if [ -d dist/homes ]; then cp -R dist/homes/. homes/; fi
          for page in over-ons diensten projecten contact offerte configurator portfolio privacy cookies bedrijfsgegevens stalen-deuren-op-maat pivotdeuren boogdeuren stalen-glaswanden glas-voor-stalen-deuren prijs-stalen-deuren; do
            if [ -d "dist/$page" ]; then mkdir -p "$page"; cp -R "dist/$page/." "$page/"; fi
          done
          cp dist/404.html 404.html
          cp dist/robots.txt robots.txt
          cp dist/sitemap.xml sitemap.xml
          touch .nojekyll
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html 404.html assets images homes over-ons diensten projecten contact offerte configurator portfolio privacy cookies bedrijfsgegevens stalen-deuren-op-maat pivotdeuren boogdeuren stalen-glaswanden glas-voor-stalen-deuren prijs-stalen-deuren robots.txt sitemap.xml .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Publish compiled MetaalMeesters website [skip ci] [skip netlify]"
            git push
          fi
      # GitHub Pages is already configured to publish from the main branch.
      # The branch publisher deploys the compiled files from the sync commit.
      # A second deploy-pages action races it and gets cancelled, so omit it.
